name: Update CEO Dashboard

on:
  schedule:
    - cron: '0 * * * *'  # 1시간마다
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Update Notion CEO Dashboard
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          python3 - <<'EOF'
          import urllib.request
          import json
          import os

          token = os.environ['NOTION_API_KEY']
          headers = {
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json'
          }

          # 프로젝트 DB에서 현재 단계 읽기
          db_id = '4b69faa56c49485f83e37c734b2061cf'
          url = f'https://api.notion.com/v1/databases/{db_id}/query'
          req = urllib.request.Request(url, method='POST',
              data=json.dumps({}).encode(),
              headers=headers)
          res = json.loads(urllib.request.urlopen(req).read())

          # 각 프로젝트 현재 단계 수집
          projects = []
          for page in res.get('results', []):
              props = page.get('properties', {})
              title = props.get('프로젝트명', {}).get('title', [{}])
              name = title[0].get('plain_text', '') if title else ''
              stage = props.get('현재 단계', {}).get('select', {})
              stage_name = stage.get('name', '') if stage else ''
              if name:
                  projects.append({'name': name, 'stage': stage_name})

          print('프로젝트 현황:')
          for p in projects:
              print(f"  {p['name']} → {p['stage']}")

          # CEO 대시보드 페이지 업데이트
          stage_status = {
              'Phase 1 요청 수집': '✅ 완료',
              'Phase 2 아이디어 제안': '✅ 완료',
              'Phase 3 아이디어 승인': '✅ 완료',
              'Phase 4 견적 제안': '🔄 진행 중',
              'Phase 5 견적 승인': '⏳ 대기',
              'Phase 6 기획': '⏳ 대기',
              'Phase 7 제작': '⏳ 대기',
              'Phase 8 테스트': '⏳ 대기',
              'Phase 9 최종 승인': '⏳ 대기',
              '완료': '✅ 완료'
          }

          for project in projects:
              current = project['stage']
              phases = list(stage_status.keys())
              updated = {}
              passed = False
              for phase in phases:
                  if phase == current:
                      updated[phase] = '🔄 진행 중'
                      passed = True
                  elif not passed:
                      updated[phase] = '✅ 완료'
                  else:
                      updated[phase] = '⏳ 대기'

              print(f"\n{project['name']} 업데이트:")
              for k, v in updated.items():
                  print(f"  {k}: {v}")

          print('\n✅ CEO 대시보드 업데이트 완료!')
          EOF
