name: Update CEO Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Update Notion CEO Dashboard
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: python3 scripts/update_ceo_dashboard.py
